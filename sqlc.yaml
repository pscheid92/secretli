version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/adapter/postgres/queries/"
    schema: "internal/adapter/postgres/migrations/"
    gen:
      go:
        package: "dbsqlc"
        out: "internal/adapter/postgres/dbsqlc"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_empty_slices: true
