# Local development infrastructure only.
# Run: docker compose up -d
# Then: go run . migrate && go run .
services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: secretli
      POSTGRES_PASSWORD: secretli
      POSTGRES_DB: secretli
    volumes:
      - postgres_data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    ports:
      - "8333:8333"
    command: "server -s3 -dir=/data"
    volumes:
      - seaweedfs_data:/data

  createbucket:
    image: curlimages/curl:latest
    depends_on:
      - seaweedfs
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      curl -s -X PUT http://seaweedfs:8333/secretli;
      "

volumes:
  postgres_data:
  seaweedfs_data:
