# Local infrastructure, plus the app itself behind the "app" profile.
#
#   docker compose -f docker/docker-compose.yml up -d                    # Postgres + SeaweedFS, for `go run .`
#   docker compose -f docker/docker-compose.yml --profile app up -d      # everything, including the app
services:
  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://secretli:secretli@postgres:5432/secretli?sslmode=disable
      S3_ENDPOINT: seaweedfs:8333
      S3_BUCKET: secretli
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: admin
      S3_USE_SSL: "false"
      S3_REGION: us-east-1
      SERVER_PORT: "8080"

  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: secretli
      POSTGRES_PASSWORD: secretli
      POSTGRES_DB: secretli
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretli -d secretli"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.21
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin
    command: "server -s3 -dir=/data"
    volumes:
      - seaweedfs_data:/data

  createbucket:
    image: curlimages/curl:8.22.0
    depends_on:
      - seaweedfs
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        code=$$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 'aws:amz:us-east-1:s3' --user 'admin:admin' -X PUT http://seaweedfs:8333/secretli || true);
        if [ $$code = 200 ] || [ $$code = 409 ]; then
          exit 0;
        fi;
        sleep 1;
      done;
      exit 1;
      "

volumes:
  postgres_data:
  seaweedfs_data:
