replicaCount: 1

image:
  repository: secretli
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

config:
  serverPort: "8080"
  s3Bucket: secretli
  s3Region: us-east-1
  s3UseSSL: "true"
  cleanupInterval: "1m"
  sessionMaxAge: "720h"
  cookieSecure: "true"
  allowedOrigins: ""
  maxFileSize: "104857600"

secret:
  databaseURL: ""
  s3Endpoint: ""
  s3AccessKey: ""
  s3SecretKey: ""
  cookieDomain: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: secretli.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

migration:
  enabled: true
