apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secretli.fullname" . }}
  labels:
    {{- include "secretli.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseURL | quote }}
  S3_ENDPOINT: {{ .Values.secret.s3Endpoint | quote }}
  S3_ACCESS_KEY: {{ .Values.secret.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secret.s3SecretKey | quote }}
  COOKIE_DOMAIN: {{ .Values.secret.cookieDomain | quote }}
