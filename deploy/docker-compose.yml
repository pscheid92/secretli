services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
      createbucket:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://secretli:secretli@postgres:5432/secretli?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_BUCKET: secretli
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      S3_REGION: us-east-1
      SERVER_PORT: "8080"
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: ""

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: secretli
      POSTGRES_PASSWORD: secretli
      POSTGRES_DB: secretli
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/secretli;
      "

volumes:
  postgres_data:
  minio_data:
