version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: weekly
    groups:
      frontend-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /
      - /docker
    schedule:
      interval: weekly
    ignore:
      # Node major versions are bumped deliberately together with .nvmrc and CI.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Go minor versions are bumped together with go.mod.
      - dependency-name: golang
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
