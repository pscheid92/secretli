name: Large E2E

on:
  workflow_dispatch:
    inputs:
      size_mib:
        description: "Synthetic file size in MiB"
        required: true
        default: "99"
      max_total_ms:
        description: "Optional total runtime threshold in milliseconds"
        required: false
        default: ""
      max_heap_mib:
        description: "Optional browser heap threshold in MiB"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  large-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Start Secretli stack
        run: |
          docker compose -f docker/docker-compose.yml up -d --build app
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker/docker-compose.yml ps
          docker compose -f docker/docker-compose.yml logs
          exit 1

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: web/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Large-file Playwright E2E
        working-directory: web/frontend
        env:
          LARGE_E2E_SIZE_MB: ${{ inputs.size_mib }}
          LARGE_E2E_MAX_TOTAL_MS: ${{ inputs.max_total_ms }}
          LARGE_E2E_MAX_HEAP_MIB: ${{ inputs.max_heap_mib }}
        run: pnpm e2e:large

      - name: Secretli logs
        if: always()
        run: docker compose -f docker/docker-compose.yml logs app || true

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
