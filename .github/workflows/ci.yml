name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the publish job requests what it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: web/frontend/package.json
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Create frontend dist stub
        run: mkdir -p web/frontend/dist && touch web/frontend/dist/.gitkeep

      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: ./...

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Frontend lint
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm biome check .

      - name: Frontend audit
        working-directory: web/frontend
        run: pnpm audit --prod --audit-level high

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: web/frontend/package.json
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Go tests
        run: |
          mkdir -p web/frontend/dist && touch web/frontend/dist/.gitkeep
          go test -race -cover ./...

      - name: Frontend tests
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: web/frontend/package.json
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web/frontend
        run: pnpm build

      - name: Playwright version
        id: playwright-version
        working-directory: web/frontend
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        working-directory: web/frontend
        run: pnpm exec playwright install chromium

      - name: Start E2E dependencies
        run: |
          docker compose -f docker/docker-compose.yml up -d postgres seaweedfs
          for i in {1..60}; do
            if docker compose -f docker/docker-compose.yml exec -T postgres pg_isready -U secretli >/dev/null; then
              break
            fi
            sleep 1
          done
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 'aws:amz:us-east-1:s3' --user 'admin:admin' -X PUT http://localhost:8333/secretli || true)
            if [ "$code" = "200" ] || [ "$code" = "409" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker/docker-compose.yml ps
          docker compose -f docker/docker-compose.yml logs
          exit 1

      - name: Build app
        run: go build -o bin/secretli-e2e .

      - name: Start app
        env:
          DATABASE_URL: postgres://secretli:secretli@localhost:5432/secretli?sslmode=disable
          S3_ENDPOINT: localhost:8333
          S3_BUCKET: secretli
          S3_ACCESS_KEY: admin
          S3_SECRET_KEY: admin
          S3_USE_SSL: "false"
          S3_REGION: us-east-1
          SERVER_PORT: "8080"
        run: |
          ./bin/secretli-e2e > secretli-e2e.log 2>&1 &
          echo $! > secretli-e2e.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat secretli-e2e.log || true
          docker compose -f docker/docker-compose.yml ps
          docker compose -f docker/docker-compose.yml logs
          exit 1

      - name: Playwright E2E
        working-directory: web/frontend
        run: pnpm e2e

      - name: Secretli logs
        if: always()
        run: |
          cat secretli-e2e.log || true
          docker compose -f docker/docker-compose.yml logs postgres seaweedfs || true

      - name: Stop services
        if: always()
        run: |
          if [ -f secretli-e2e.pid ]; then kill "$(cat secretli-e2e.pid)" || true; fi
          docker compose -f docker/docker-compose.yml down -v

  build-and-publish:
    needs: [lint, test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}-{{sha}}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in $TAGS; do
            images="$images ${tag}@${DIGEST}"
          done
          cosign sign --yes $images
