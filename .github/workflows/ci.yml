name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Create frontend dist stub
        run: mkdir -p web/frontend/dist && touch web/frontend/dist/.gitkeep

      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: ./...

      - name: Frontend lint
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm biome check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Go tests
        run: |
          mkdir -p web/frontend/dist && touch web/frontend/dist/.gitkeep
          go test -cover ./...

      - name: Frontend tests
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web/frontend
        run: pnpm build

      - name: Playwright version
        id: playwright-version
        working-directory: web/frontend
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        working-directory: web/frontend
        run: pnpm exec playwright install chromium

      - name: Start E2E dependencies
        run: |
          docker compose -f docker/docker-compose.dev.yml up -d postgres seaweedfs
          for i in {1..60}; do
            if docker compose -f docker/docker-compose.dev.yml exec -T postgres pg_isready -U secretli >/dev/null; then
              break
            fi
            sleep 1
          done
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 'aws:amz:us-east-1:s3' --user 'admin:admin' -X PUT http://localhost:8333/secretli || true)
            if [ "$code" = "200" ] || [ "$code" = "409" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker/docker-compose.dev.yml ps
          docker compose -f docker/docker-compose.dev.yml logs
          exit 1

      - name: Build app
        run: go build -o bin/secretli-e2e .

      - name: Start app
        env:
          DATABASE_URL: postgres://secretli:secretli@localhost:5432/secretli?sslmode=disable
          S3_ENDPOINT: localhost:8333
          S3_BUCKET: secretli
          S3_ACCESS_KEY: admin
          S3_SECRET_KEY: admin
          S3_USE_SSL: "false"
          S3_REGION: us-east-1
          SERVER_PORT: "8080"
          COOKIE_SECURE: "false"
          COOKIE_DOMAIN: ""
        run: |
          ./bin/secretli-e2e > secretli-e2e.log 2>&1 &
          echo $! > secretli-e2e.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat secretli-e2e.log || true
          docker compose -f docker/docker-compose.dev.yml ps
          docker compose -f docker/docker-compose.dev.yml logs
          exit 1

      - name: Playwright E2E
        working-directory: web/frontend
        run: pnpm e2e

      - name: Secretli logs
        if: always()
        run: |
          cat secretli-e2e.log || true
          docker compose -f docker/docker-compose.dev.yml logs postgres seaweedfs || true

      - name: Stop services
        if: always()
        run: |
          if [ -f secretli-e2e.pid ]; then kill "$(cat secretli-e2e.pid)" || true; fi
          docker compose -f docker/docker-compose.dev.yml down -v

  build-and-publish:
    needs: [lint, test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}-{{sha}}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
