name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Create frontend dist stub
        run: mkdir -p web/frontend/dist && touch web/frontend/dist/.gitkeep

      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: ./...

      - name: Frontend lint
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm biome check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Go tests
        run: |
          mkdir -p web/frontend/dist && touch web/frontend/dist/.gitkeep
          go test -cover ./...

      - name: Frontend tests
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Start Secretli stack
        run: |
          docker compose -f docker/docker-compose.yml up -d --build app
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker/docker-compose.yml ps
          docker compose -f docker/docker-compose.yml logs
          exit 1

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        working-directory: web/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: web/frontend
        run: pnpm e2e

      - name: Secretli logs
        if: always()
        run: docker compose -f docker/docker-compose.yml logs app || true

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  build-and-publish:
    needs: [lint, test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}-{{sha}}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
